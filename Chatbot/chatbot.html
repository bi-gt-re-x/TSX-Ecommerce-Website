<!DOCTYPE html>
<html>
    <head>
        <title>Chatbot</title>
    </head>
    <body>
    <div class="js-container"></div>

    <sciprt src="React-Basics.js"></sciprt>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatInput() {
            return (
                <>
                    <input placeholder="Send a Message to Chatbot" size="30"/>
                    <button>Send</button>
                </>
            );
        }

        function ChatMessage(props) {
            const message = props.message;
            const sender = props.sender;

            if (sender === 'robot') {
                return (
                    <div>
                        <img src="robot_image.png" width="50" />
                        {message}
                    </div>
                );
            }

            else {
                return (
                    <div>
                        {message}
                        <img src="person_image.png" width="50" />
                    </div>
                );
            }
        }

        function ChatMessages() {
            const array = React.useState([{
                message: 'Hello Chatbot',
                sender: 'user',
                id: 'id1'
            }, {
                message: 'Hello! How can I help you?',
                sender: 'robot',
                id: 'id2',
            }, {
                message: "Can you give me Today's date?",
                sender: 'user',
                id: 'id3'
            }, {
                message: "Today is August 2nd",
                sender: 'robot',
                id: 'id4'
            }]);
            const chatMessages = array[0];
            const setChatMessages = array[1];

            function sendMessage() {
                setChatMessages([
                    ...chatMessages,
                    {
                        message: 'test',
                        sender: 'user',
                        id: crypto.randomUUID(),
                    }
                ]);
            }

            return (
                <>
                    <button onClick={sendMessage}>Send Message</button>

                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender} 
                                key={chatMessage.id}
                            />
                        )
                    })}
                </>
            );
        }

        function App() {
            return (
                <>
                    <ChatInput />
                    <ChatMessages />
                </>
            );
        }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
